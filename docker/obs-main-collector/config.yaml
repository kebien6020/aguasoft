receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 1024
    spike_limit_mib: 256
  batch:
    timeout: 5s
    send_batch_size: 1000

exporters:
  prometheusremotewrite:
    endpoint: http://obs-prometheus:9090/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true
  clickhouse:
    endpoint: tcp://obs-clickhouse:9000?dial_timeout=5s
    database: otel
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    ttl: 720h
    create_schema: true
    async_insert: true

    sending_queue:
      enabled: true
      num_consumers: 2
      batch:
        min_size: 5000
        flush_timeout: 5s

    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 0s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]

  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheusremotewrite]

    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [clickhouse]

    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [clickhouse]
